<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Something Went Wrong | Aditya Singh</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='700' fill='%2322d3ee' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #09090b; color: #f1f5f9; font-family: 'DM Sans', sans-serif;
            text-align: center; padding: 24px; position: relative; overflow: hidden;
        }
        .glow {
            position: absolute; left: 50%; top: 15%; width: 60vw; max-width: 700px; aspect-ratio: 1;
            transform: translateX(-50%); border-radius: 9999px; pointer-events: none;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.14), transparent 70%);
            filter: blur(30px); animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }
        .eyebrow {
            font-family: 'Roboto Mono', monospace; font-size: 0.75rem; letter-spacing: 0.15em;
            text-transform: uppercase; color: #fb7185; margin-bottom: 1.5rem; position: relative;
        }
        h1 {
            font-size: clamp(4rem, 15vw, 8rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em;
            position: relative; margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem; color: #a1a1aa; max-width: 32rem; line-height: 1.6;
            position: relative; margin-bottom: 2rem;
        }
        .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; position: relative; }
        a.btn {
            font-family: 'Roboto Mono', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; text-decoration: none; padding: 1rem 1.75rem; border-radius: 0.75rem;
            transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
        }
        a.btn-primary { color: #09090b; background: #22d3ee; }
        a.btn-primary:hover { background: #67e8f9; }
        a.btn-secondary { color: #f1f5f9; background: transparent; border: 1px solid #3f3f46; }
        a.btn-secondary:hover { border-color: #71717a; }
        a.btn:active { transform: scale(0.98); }
        @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <span class="eyebrow">// SERVER_ERROR</span>
    <h1>500</h1>
    <p>Something broke on this end, not yours. Try again in a moment, or reach out directly if it keeps happening.</p>
    <div class="actions">
        <a class="btn btn-primary" href="/">&larr; Back to home</a>
        <a class="btn btn-secondary" id="email-link" href="#" data-email-b64="c2luZ2guYWRpdHlhMDM5NUBnbWFpbC5jb20=">Email Aditya</a>
    </div>
    <script>
        // Same base64 obfuscation as the main site - keeps the address out of
        // static source for simple scrapers, consistent with the rest of the site.
        var el = document.getElementById('email-link');
        el.href = 'mailto:' + atob(el.dataset.emailB64);
    </script>
</body>
</html>
