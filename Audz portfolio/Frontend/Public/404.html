<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Aditya Singh</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='700' fill='%2322d3ee' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #09090b; color: #f1f5f9; font-family: 'DM Sans', sans-serif;
            text-align: center; padding: 24px; position: relative; overflow: hidden;
        }
        .glow {
            position: absolute; left: 50%; top: 15%; width: 60vw; max-width: 700px; aspect-ratio: 1;
            transform: translateX(-50%); border-radius: 9999px; pointer-events: none;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.16), transparent 70%);
            filter: blur(30px); animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }
        .eyebrow {
            font-family: 'Roboto Mono', monospace; font-size: 0.75rem; letter-spacing: 0.15em;
            text-transform: uppercase; color: #67e8f9; margin-bottom: 1.5rem; position: relative;
        }
        h1 {
            font-size: clamp(4rem, 15vw, 8rem); font-weight: 700; line-height: 1; letter-spacing: -0.02em;
            position: relative; margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem; color: #a1a1aa; max-width: 32rem; line-height: 1.6;
            position: relative; margin-bottom: 2rem;
        }
        a.home-link {
            font-family: 'Roboto Mono', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: #09090b; background: #22d3ee; text-decoration: none;
            padding: 1rem 1.75rem; border-radius: 0.75rem; position: relative; transition: background 0.2s ease, transform 0.15s ease;
        }
        a.home-link:hover { background: #67e8f9; }
        a.home-link:active { transform: scale(0.98); }
        @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <span class="eyebrow">// ROUTE_NOT_FOUND</span>
    <h1>404</h1>
    <p>This page doesn't exist, or it moved. The rest of the site is one page below.</p>
    <a class="home-link" href="/">&larr; Back to home</a>
</body>
</html>
